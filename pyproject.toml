[project]
name = "clustering-llm-router"
version = "0.1.0"
description = "Embedding-clustering based LLM router: offline pipeline (corpus/embed/cluster/calibrate/evaluate) + the online routing runtime"
readme = "README.md"
authors = [
    { name = "Hamad Safdar", email = "hamad.safdar@emumba.com" }
]
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.0.1",
    "einops>=0.8.2",
    "huggingface-hub>=0.36.2",
    "jsonschema>=4.26.0",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "pillow>=12.3.0",
    "psutil>=7.2.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.6.1",
    "torch>=2.13.0",
    "transformers>=4.40,<5",
    "typer>=0.27.1",
]

[project.scripts]
router = "router:main"

# This machine has no GPU, and PyPI's default torch wheel pulls a full CUDA stack
# (nvidia-cudnn/nccl/etc, multiple GB). Force the CPU-only wheel instead.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.11.5,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "router"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]
