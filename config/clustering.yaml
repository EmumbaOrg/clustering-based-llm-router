# K-means configuration, per the routing spec's §4.2 starting point. Candidate K values are all
# computed and reported with diagnostics by `router-pipeline cluster`; promoting one to the final
# artifact is a human decision via `router-pipeline build-artifact --k <value>`, not automated.

k_candidates: [16, 24, 32]
default_k: 24

seed: 42
n_init: 10   # pass explicitly — sklearn's n_init="auto" resolves to a single run for k-means++ init
