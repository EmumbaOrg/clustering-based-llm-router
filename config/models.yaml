# Candidate model roster. Read by calibration (`router pipeline calibrate`) to decide which models
# to measure, and by evaluation (and eventually the runtime) to score the routing formula's cost
# term.
#
# This is the single source of truth for the candidate roster — see ../README.md's "Config and
# artifact schema". A
# candidate model missing from the calibration profiles becomes a hard startup failure in the
# runtime (see docs/specs/2026-08-04-cluster-routing-implementation-plan.md, Phase 2).
#
# cost_input / cost_output are $ per 1k tokens. Ordered cheapest first.
#
# `runner` selects how a candidate produces a solution during calibration:
#   reference — returns the dataset's own gold solution. A grader-validation control: must score
#               ~100%, proving the grader ACCEPTS correct code. Not a real model.
#   null      — returns nothing. The opposite control: must score ~0%, proving the grader REJECTS
#               incorrect code. Together with `reference` this brackets the grader, so a low score
#               from a weak real model can be told apart from a broken grader.
#   pi        — the real path: invoke the Pi coding agent headless against `provider`/`model_id`.

models:
  # ── Grader-validation controls (not real models; zero cost, no API, no LLM) ────────────────
  # Commented out for calibration runs against an already ground-truth-verified pin (see
  # select-verified-tasks / ground_truth_registry.json) — re-grading reference/null per task here
  # is then redundant with what the registry already confirmed, and skipping them is a supported,
  # documented path: _ground_truth_invalid(None, None) treats "control absent from this run's
  # roster" as "can't tell, not invalid," so real models still grade normally. Re-enable these two
  # entries for any run against a pin that did NOT go through select-verified-tasks.
  # - model_id: reference-oracle
  #   provider: stub
  #   runner: reference
  #   cost_input: 0
  #   cost_output: 0
  #   context_window: 0
  #   max_tokens: 0

  # - model_id: null-baseline
  #   provider: stub
  #   runner: "null"   # quoted — bare null is a YAML keyword and would parse as None
  #   cost_input: 0
  #   cost_output: 0
  #   context_window: 0
  #   max_tokens: 0

  # ── Local llama.cpp candidates (dev/testing only — see README "Aligning config/models.yaml" ─
  # section). Each provider below needs a matching `~/.pi/agent/models.json` entry with a
  # baseUrl pointing at a local `llama serve` instance already running and holding that model
  # loaded — see the two `llama serve -hf ... --port ...` commands this pair was set up with.
  # cost_input/cost_output here are nominal placeholders proportional to parameter count (there's
  # no metered API cost for a self-hosted model) — kept nonzero and distinct so normalise_costs
  # doesn't collapse the cost term to zero for this pair (see scoring.py's normalise_costs).
  # Qwen2.5-Coder (7B/14B) candidates removed — confirmed empirically this session that
  # llama.cpp never translates their tool-call attempts into a real `message.tool_calls` (wrong
  # XML tag, upstream llama.cpp issue, unresolved), so every swe-smith/swe-gym/multi-swe-rl task
  # failed 100% of the time regardless of the model's actual coding ability. Rather than keep a
  # model that's capped to self-contained sources only, Llama-3.1-8B-Instruct below has confirmed
  # working tool calls (verified via direct curl: real `message.tool_calls`, `finish_reason:
  # "tool_calls"`) and isn't limited that way.
  - model_id: llama-3.1-8b-instruct
    provider: local-llama31
    runner: pi
    cost_input: 0.00003
    cost_output: 0.00003
    context_window: 8192
    max_tokens: 2048

  # ── Anthropic, native Pi provider (no ~/.pi/agent/models.json entry needed) ────────────────
  # `provider: anthropic` is built into Pi itself — confirmed via `pi auth check --provider
  # anthropic` returning `not_ready` (a recognized-but-unauthenticated provider), not an
  # unknown-provider error. Needs `pi`'s own login (OAuth or ANTHROPIC_API_KEY) before use — no
  # baseUrl/apiKey config on our side at all, unlike every other provider in this file.
  # cost_input/cost_output converted from Anthropic's published $1.00 / $5.00 per 1M tokens
  # (this file's convention is $ per 1k) — real, metered spend, unlike the local candidates above.
  # Disabled (2026-08-25) in favor of gpt-5-nano for this round of calibration — re-enable by
  # uncommenting.
  # - model_id: claude-haiku-4-5
  #   provider: anthropic
  #   runner: pi
  #   cost_input: 0.001
  #   cost_output: 0.005
  #   context_window: 200000
  #   max_tokens: 2048

  # ── OpenAI, via Pi's plain `openai` provider ────────────────────────────────────────────────
  # `pi --list-models luna` resolves this exact (provider, model_id) pair against Pi's own model
  # catalog, which is where cost_input/cost_output below come from (OpenAI's published $0.20/$1.20
  # per 1M tokens, developers.openai.com/api/docs/models/gpt-5.6-luna, converted to this file's
  # $-per-1k convention) — Pi computes its own per-call cost from the same catalog independently
  # (see runner.py's TokenUsage), so these two numbers should always agree.
  # The key was originally stored under Pi's `azure-openai-responses` provider by mistake (needs
  # an Azure endpoint, which this key doesn't have — confirmed failing with "Azure OpenAI base URL
  # is required"); re-added under plain `openai` and confirmed via `pi auth check --provider
  # openai` -> ready. context_window is 272K here (not the 1.05M quoted for the azure-responses
  # variant) — that's `pi --list-models luna`'s reported ceiling for THIS provider mapping, and
  # matches OpenAI's own pricing page: requests over 272K input tokens get a 2x/1.5x price
  # multiplier, i.e. 272K is the standard-rate window, not the model's absolute max.
  # Per instruction: gpt-5.6-luna ONLY — no other model from the gpt-5.6/gpt-5 family is enabled.
  - model_id: gpt-5.6-luna
    provider: openai
    runner: pi
    cost_input: 0.0002
    cost_output: 0.0012
    context_window: 272000
    max_tokens: 128000

  # ── OpenAI, via Pi's plain `openai` provider (same credential as gpt-5.6-luna) ─────────────
  # Cheapest model in OpenAI's entire current lineup — verified live via `pi --list-models nano`:
  # provider=openai, context=400K, max-out=128K, matching the values below exactly (unlike Luna,
  # no correction needed here). cost_input/cost_output are OpenAI's own published $0.05/$0.40 per
  # 1M tokens, checked live against developers.openai.com/api/docs/pricing.
  - model_id: gpt-5-nano
    provider: openai
    runner: pi
    cost_input: 0.00005
    cost_output: 0.0004
    context_window: 400000
    max_tokens: 128000

  # ── OpenAI, via Pi's plain `openai` provider (same credential as gpt-5.6-luna/gpt-5-nano) ──
  # Codex-tuned coding model. Verified live via `pi --list-models codex`: provider=openai,
  # context=400K, max-out=128K, matching the values below exactly. cost_input/cost_output are
  # OpenAI's own published $1.75/$14.00 per 1M tokens (standard mode, not the 2x "fast" mode),
  # checked live against developers.openai.com/api/docs/pricing and cross-verified against
  # OpenRouter's own published per-token price for openai/gpt-5.3-codex — both agreed exactly.
  # - model_id: gpt-5.3-codex
  #   provider: openai
  #   runner: pi
  #   cost_input: 0.00175
  #   cost_output: 0.014
  #   context_window: 400000
  #   max_tokens: 128000

  # ── Hosted candidates (defined, not yet calibrated — needs API keys and real spend) ────────
  # Commented out so calibration doesn't attempt them. Uncomment as keys become available.
  # - model_id: gpt-5.4-nano
  #   provider: openai
  #   runner: pi
  #   cost_input: 0.0002
  #   cost_output: 0.00125
  #   context_window: 400000
  #   max_tokens: 128000
  #
  # - model_id: gpt-5.4-mini
  #   provider: openai
  #   runner: pi
  #   cost_input: 0.00075
  #   cost_output: 0.0045
  #   context_window: 400000
  #   max_tokens: 128000
  #
  # - model_id: gpt-5.5
  #   provider: openai
  #   runner: pi
  #   cost_input: 0.005
  #   cost_output: 0.03
  #   context_window: 1050000
