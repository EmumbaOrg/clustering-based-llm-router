# Calibration configuration — how model quality profiles get measured per cluster.
#
# Calibration runs each candidate model against tasks whose ground truth we can actually execute,
# groups the pass/fail outcomes by the cluster each task was assigned to, and produces
# artifacts/model-profiles.json. See ../README.md for the full protocol.

# Sources whose ground truth we can grade today. BigCodeBench and DS-1000 are self-contained —
# their tests ship inline in each row, so grading needs only a Python interpreter. swe-smith,
# swe-gym, and multi-swe-rl are all Docker-based (grading/swesmith.py, grading/swegym.py,
# grading/multiswerl.py) — they need a local Docker daemon, which isn't available in every
# environment this pipeline runs in (e.g. Colab); drop them from this list rather than running
# there. multi-swe-rl is a Go-only pilot — the other 6 languages in that dataset (C, C++, Java, JS,
# Rust, TS) remain corpus-only (see grading/multiswerl.py's module docstring for why).
gradeable_sources:
  - bigcodebench
  - ds1000
  - swe-smith    # Docker-based — commented out: Docker isn't running and we're already loading
  - swe-gym      # two heavy local LLM servers (7B+14B); avoid repeating the earlier swap-thrash
  - multi-swe-rl # incident by also spinning up Docker Desktop's VM on top of that.

# Target calibration tasks per cluster. The spec's reference figure is 20+ per cluster against a
# 24-cluster map; keep it low here because this pass targets pipeline completeness, not
# statistically confident error rates.
tasks_per_cluster: 10

# `candidate_pool_oversample` used to live here — select_tasks() no longer embeds a per-run random
# candidate pool at all (see calibrate.py::select_tasks's docstring for why: it silently left some
# clusters with zero tasks). Task->cluster assignment now comes from artifacts/task-cluster-map.json,
# computed once at `build-artifact` time.

# Hard wall-clock limit, in seconds, for a `run_pi` model call AND for grading any source with no
# entry in task_timeout_overrides below (BigCodeBench/DS-1000's sub-second in-process runs are
# comfortably inside this). Exceeding this yields the `error_timeout` outcome, which is EXCLUDED
# from error rates rather than counted as a model failure — a slow machine or a cold image pull
# must never look like a bad model.
task_timeout_seconds: 300

# Per-source override for GRADING calls only (never run_pi, so a hung LLM call can't inherit a
# Docker source's much longer leash) — additive and backward-compatible; a source missing here
# just uses task_timeout_seconds above. swe-smith needs more room than that base value: image pull
# (if uncached) + patch apply + conda activate + the full FAIL_TO_PASS/PASS_TO_PASS suite. swe-gym
# needs even more headroom for a rare but real worst case: a patch touching pandas' meson.build
# triggers a full ~125-file Cython rebuild on next import (measured directly against a real
# instance — several minutes), entirely automatic via the editable install's build backend, not
# something this pipeline's own code controls or can skip. multi-swe-rl needs the most headroom of
# all: its largest repo (istio) measured at 6m51s for a single grading call against ~11,000
# individual Go subtests — sized well above that measured worst case, not guessed.
task_timeout_overrides:
  swe-smith: 600
  swe-gym: 900
  multi-swe-rl: 1200

# Smoothing: shrink each per-cluster error rate toward the model's own global rate, so a lucky
# 4-for-4 in a thin cluster doesn't read as a confident 0% error rate.
#   smoothed = (n_failed + prior_weight * global_raw_error_rate) / (n_tasks + prior_weight)
# Higher prior_weight = trust the cluster's own number less. The runtime reads only the stored
# smoothed value and never recomputes it, which is what makes a routing decision reproducible
# from the artifact alone.
smoothing:
  method: shrink_to_model_global
  prior_weight: 5

# Fraction of the selected task pool held back for evaluation, disjoint from calibration.
# Evaluation must never score against tasks a model was calibrated on.
holdout_fraction: 0.3

# Deterministic task selection and holdout split.
seed: 42

# Lambda values swept during evaluation (spec §6). Deliberately a sweep, not a single value —
# the accuracy/cost tradeoff is what evaluation is meant to measure, not assume.
lambda_sweep: [0, 0.02, 0.05, 0.10, 0.20, 0.40]
